    <rect x="682" y="620" width="240" height="14" opacity="0.56"/>
    <rect x="936" y="620" width="300" height="14" opacity="0.18"/>
    <rect x="144" y="684" width="316" height="14" opacity="0.34"/>
    <rect x="474" y="684" width="630" height="14" opacity="0.16"/>
    <rect x="1118" y="684" width="250" height="14" opacity="0.48"/>
