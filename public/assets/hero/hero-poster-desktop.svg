<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Abstract editing timeline</title>
  <desc id="desc">A monochrome cinematic composition of frames, tracks, and a central light signal.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050607"/>
      <stop offset="0.52" stop-color="#121519"/>
      <stop offset="1" stop-color="#030405"/>
    </linearGradient>
    <radialGradient id="glow" cx="62%" cy="42%" r="42%">
      <stop offset="0" stop-color="#f4f2ec" stop-opacity="0.42"/>
      <stop offset="0.28" stop-color="#d8d9dc" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#fff" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <g fill="none" stroke="#f4f2ec" stroke-opacity="0.28">
    <rect x="128" y="120" width="568" height="356" rx="4"/>
